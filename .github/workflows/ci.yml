name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Docker builds live in docker.yml. Fly.io deploy lives in fly-deploy.yml (when FLY_API_TOKEN is set).
# This workflow owns the Go agent and Rust quality gates.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l *.go)" || { gofmt -l *.go; exit 1; }
      - name: go vet
        run: go vet .
      - name: go test
        run: go test -race -count=1 .
      - name: go build (all release targets)
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null . || exit 1
          done

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      # TODO(2026-09-01): drop continue-on-error once src/ is rustfmt-clean.
      - name: cargo fmt
        run: cargo fmt --all -- --check
        continue-on-error: true

      # TODO(2026-09-01): drop continue-on-error once clippy warnings are resolved.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      # TODO(2026-09-01): drop continue-on-error once the Rust test suite is unstuck.
      - name: cargo test
        run: cargo test --verbose
        continue-on-error: true

      # TODO(2026-09-01): drop continue-on-error once Cargo.lock + src/ compile.
      - name: cargo build --release
        run: cargo build --release
        continue-on-error: true
